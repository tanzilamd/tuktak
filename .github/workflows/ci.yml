name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run local:start
      - name: Verify repeat startup without ripgrep
        run: |
          rg() { echo 'Local startup must not require ripgrep' >&2; return 127; }
          export -f rg
          before="$(docker exec tuktak-test-db-1 psql -U postgres -Atc 'select count(*) from public.profiles')"
          npm run local:start
          after="$(docker exec tuktak-test-db-1 psql -U postgres -Atc 'select count(*) from public.profiles')"
          test "$before" = "$after"
      - run: npm run build
      - run: |
          npm start > /tmp/tuktak-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health
      - run: PLAYWRIGHT_USE_PACKAGED_CHROMIUM=1 LOCAL_SUPABASE_TESTS=1 npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
